<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flea Circus - Show Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            color: #aaa;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            display: inline-block;
            padding: 20px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .display-link {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .display-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .control-link {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .control-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(245, 87, 108, 0.4);
        }

        .info {
            margin-top: 60px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #aaa;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .info strong {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎪 Flea Circus</h1>
        <p class="subtitle">Show Control System</p>

        <div class="links">
            <a href="display.html" class="display-link">📺 Audience Display</a>
            <a href="control.html" class="control-link">🎛️ Operator Console</a>
        </div>

        <div class="info">
            <p><strong>Setup Instructions:</strong></p>
            <p>Open the Audience Display in fullscreen on your main screen.<br>
            Open the Operator Console on your control device (tablet, laptop).<br>
            Both will sync automatically on the same network.</p>
        </div>
    </div>
</body>
</html>
