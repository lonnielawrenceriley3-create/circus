<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeechCam</title>
<style>
  :root { --bg:#1d1712; --card:#2a211a; --ink:#f3e6cf; --dim:#b39f80; --brass:#d4a64a; --rec:#d33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 Georgia, "Times New Roman", serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:28px; letter-spacing:4px; text-align:center; color:var(--brass); margin:8px 0 2px; }
  .sub { text-align:center; color:var(--dim); font-size:13px; letter-spacing:2px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid #4a3a2a; border-radius:12px; padding:16px; margin-bottom:14px; }
  .timer { font:600 64px/1 "Courier New", monospace; text-align:center; margin:8px 0; }
  .lights { display:flex; justify-content:center; gap:18px; margin:10px 0 16px; }
  .lamp { width:44px; height:44px; border-radius:50%; background:#3a2f26; border:3px solid #6b5640; }
  .lamp.green.on { background:#2ecc40; box-shadow:0 0 18px #2ecc40; }
  .lamp.yellow.on { background:#ffdc00; box-shadow:0 0 18px #ffdc00; }
  .lamp.red.on { background:#ff4136; box-shadow:0 0 18px #ff4136; }
  .lamp.red.blink { animation: blink .8s steps(2) infinite; }
  @keyframes blink { 50% { background:#3a2f26; box-shadow:none; } }
  button { font:inherit; border:0; border-radius:10px; cursor:pointer; }
  #rec { width:100%; padding:18px; font-size:22px; letter-spacing:3px; background:var(--brass); color:#1d1712; }
  #rec.on { background:var(--rec); color:#fff; }
  label { display:block; color:var(--dim); font-size:13px; margin:10px 0 4px; }
  input, select { width:100%; padding:10px; font:inherit; background:#1d1712; color:var(--ink); border:1px solid #6b5640; border-radius:8px; }
  .err { background:#5a1d1d; border-color:#a33; display:none; }
  .meta { color:var(--dim); font-size:13px; }
  .rec-item { border-top:1px solid #4a3a2a; padding:10px 0; }
  .rec-item:first-child { border-top:0; }
  .rec-item a { color:var(--brass); margin-right:12px; }
  .del { background:none; color:#c66; padding:0; font-size:13px; float:right; }
  .row { display:flex; justify-content:space-between; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>SPEECHCAM</h1>
  <div class="sub">CLUB SPEECH RECORDER</div>

  <div class="card err" id="err"></div>

  <div class="card">
    <div class="timer" id="timer">0:00</div>
    <div class="lights">
      <div class="lamp green" id="l-green"></div>
      <div class="lamp yellow" id="l-yellow"></div>
      <div class="lamp red" id="l-red"></div>
    </div>
    <button id="rec">RECORD</button>
    <label for="speaker">Speaker</label>
    <input id="speaker" placeholder="Name (used in the file name)" autocomplete="off">
    <label for="profile">Timing</label>
    <select id="profile"></select>
  </div>

  <div class="card">
    <div class="row"><span>Recordings</span><span id="disk"></span></div>
    <div id="list"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let st = null, editing = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function render(s) {
  const firstLoad = !st;
  st = s;
  $("timer").textContent = fmt(s.elapsed);
  for (const c of ["green", "yellow", "red"]) {
    const on = s.light === c || (c === "red" && s.light === "red_blink");
    $("l-" + c).classList.toggle("on", on);
  }
  $("l-red").classList.toggle("blink", s.light === "red_blink");
  $("rec").textContent = s.recording ? "STOP" : "RECORD";
  $("rec").classList.toggle("on", s.recording);
  $("profile").disabled = s.recording;
  if (firstLoad || $("profile").options.length !== s.profiles.length) {
    $("profile").innerHTML = s.profiles.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
  }
  $("profile").value = s.profile;
  if (!editing) $("speaker").value = s.speaker;
  $("err").style.display = s.error ? "block" : "none";
  $("err").textContent = s.error || "";
  $("disk").textContent = `${(s.free_mb / 1024).toFixed(1)} GB free`;
}

async function loadList() {
  const recs = await api("/api/recordings");
  const busy = st ? st.processing : [];
  $("list").innerHTML = recs.length ? recs.map(r => {
    const m = r.meta || {};
    const files = r.files.map(f => `<a href="/files/${encodeURIComponent(f.name)}">${f.name.endsWith(".mp4") ? "MP4" : "Master MKV"} (${f.mb} MB)</a>`).join("");
    const processing = busy.some(n => n.startsWith(r.name)) ? " · converting…" : "";
    const len = m.duration_seconds ? fmt(m.duration_seconds) : "";
    const verdict = m.verdict ? ` · ${m.verdict}` : "";
    return `<div class="rec-item"><button class="del" data-name="${esc(r.name)}">delete</button>
      <div>${esc(m.speaker || r.name)}</div>
      <div class="meta">${m.recorded ? m.recorded.replace("T", " ") : ""} · ${len}${verdict}${processing}</div>
      <div>${files}</div></div>`;
  }).join("") : '<div class="meta">Nothing recorded yet.</div>';
}

$("rec").onclick = async () => {
  $("rec").disabled = true;
  render(await api(st && st.recording ? "/api/stop" : "/api/start", { speaker: $("speaker").value }));
  $("rec").disabled = false;
  loadList();
};
$("profile").onchange = async () => render(await api("/api/settings", { profile: $("profile").value }));
$("speaker").onfocus = () => editing = true;
$("speaker").onblur = async () => { editing = false; render(await api("/api/settings", { speaker: $("speaker").value })); };
$("list").onclick = async e => {
  const name = e.target.dataset && e.target.dataset.name;
  if (name && confirm(`Delete ${name}?`)) { await api("/api/delete", { name }); loadList(); }
};

let tick = 0;
setInterval(async () => {
  try { render(await api("/api/status")); } catch (e) {}
  if (++tick % 5 === 0) loadList();
}, 1000);
api("/api/status").then(render).then(loadList);
</script>
</body>
</html>
