# SpeechCam settings. install.sh copies this to /etc/speechcam/config.toml;
# edit that copy, then: sudo systemctl restart speechcam

recordings_dir = "/home/pi/recordings"

# Camera. "picamera" = Raspberry Pi Camera Module 3 on the ribbon connector,
# H.264 encoded in hardware while recording (no waiting afterwards).
# "hdmi" = an HDMI source (e.g. a phone) through a USB capture dongle.
camera         = "picamera"
video_size     = "1920x1080"
video_fps      = 30
video_bitrate  = 6000000          # bits/s: ~45 MB per minute
# Extra rpicam-vid options. Camera upside down? add "--hflip --vflip".
camera_options = "--autofocus-mode continuous"

# Only for camera = "hdmi"
video_device = "auto"

# Microphone: "auto" picks the first USB mic that isn't the capture dongle.
# Or set audio_match to part of its name, e.g. "Wireless".
audio_device   = "auto"
audio_match    = ""
audio_channels = 1
audio_rate     = 48000
audio_offset   = 0.0     # seconds; nudge if lips and voice look out of sync

max_minutes = 30       # safety stop
min_free_mb = 1500     # refuse to start below this

# After each recording, make an .mp4 in the background (paused while
# recording). With the Pi camera this only re-packages the file and encodes
# the audio, about a minute per speech.
transcode         = true
transcode_bitrate = "3M"
keep_master       = false   # true = keep the .mkv too
# Optional crop applied during conversion (forces a slower full re-encode),
# e.g. "crop=1600:900:160:90"  (w:h:x:y)
crop = ""

beep_device = "plughw:CARD=Headphones"   # PWM audio -> PAM8302
volume      = 0.6
web_port    = 8080

default_profile = "speech_5_7"

[pins]   # BCM numbering
record = 17
mode   = 27
tally  = 22
green  = 5
yellow = 6
red    = 26

# Timing light profiles (seconds). MODE button cycles them; the camera beeps
# the profile's position (1 beep = first). Red blinks at red + 30 s.
[[profiles]]
id = "off"
name = "No timing lights"

[[profiles]]
id = "table_topics"
name = "Table Topics (1-2 min)"
green = 60
yellow = 90
red = 120

[[profiles]]
id = "evaluation"
name = "Evaluation (2-3 min)"
green = 120
yellow = 150
red = 180

[[profiles]]
id = "icebreaker"
name = "Ice Breaker (4-6 min)"
green = 240
yellow = 300
red = 360

[[profiles]]
id = "speech_5_7"
name = "Speech (5-7 min)"
green = 300
yellow = 360
red = 420

[[profiles]]
id = "speech_10_12"
name = "Speech (10-12 min)"
green = 600
yellow = 660
red = 720
